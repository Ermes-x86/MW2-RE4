[MW2RE4]
; Where the MW2 runtime lives (set by the installer).
RuntimeDir=
RuntimeExecutable=iw4l-re4.exe
RuntimeSettings=re4-bridge-settings.cfg
MappingName=MW2RE4_v1
; Key that turns MW2 on/off (virtual-key code; 0x75 = F6).
ToggleKey=0x75
; MW2 field of view.
FOV=90
; RE4 units per metre (RE4 uses about 1 mm per unit).
UnitsPerMeter=1000
; Mouse: multiplier on RE4's mouse movement before MW2's own sensitivity; 1 inverts up/down.
MouseScale=1
InvertMouseY=0
; Metres of room collision around Leon sent to MW2.
CollisionRadius=14
; 1 hides Leon's body while MW2 has control (first person).
HideLeon=1
; 1 shows the MW2 controls panel while MW2 has control (F7 toggles it in game).
ShowControls=1
; F5 toggles the RE4 -> MW2 gun list shown in the attache case and the merchant
ShowGunList=0
; Research: 1 logs which RE4 code damages enemies (only while MW2 is off).
DamageTrace=0
; How far RE4's 'press ... to' prompts move up while MW2 has control (RE4 2D units; 0 = don't move).
PromptRaise=200
; how far captions like 'Will you use the emblem?' move up while MW2 is on (0 = not moved)
MessageRaise=150
; UAV radar (U key): seconds online, seconds before it can be called again
UavSeconds=30
UavCooldown=60
; F10 settings menu also saves these
InfiniteAmmo=0
; 0 TF141 desert (mp_rust), 1 TF141 urban (mp_favela), 2 TF141 snow (mp_derail), 3 US Army Rangers (mp_invasion), 4 Navy SEALs (mp_subbase)
Skin=0
; MW2 render size (F10): 640x360, 800x450, 960x540, 1024x576 or 1280x720; larger is sharper but slower
Resolution=960x540

; gun damage multipliers (F11 menu), 1.0 = exactly the RE4 gun's damage with its upgrades:
; 0 normal pistols, 1 tough pistols, 2 SMGs, 3 assault rifles, 4 12 gauge, 5 snipers
Damage0=1.0
Damage1=1.0
Damage2=1.0
Damage3=1.0
Damage4=1.0
Damage5=1.0

; 1 = MW2's gun and ammo come from Leon's attache case: the equipped RE4 gun becomes its MW2 gun, its loaded
; ammo is MW2's clip and the matching ammo boxes are MW2's reserve; 1 switches to the next gun in the case.
; 0 = MW2 keeps its own guns (F8 menu, F9 refill).
Re4Inventory=1

[Guns]
; The MW2 gun each RE4 gun becomes (MW2 weapon names: usp, beretta, deserteagle, deserteaglegold,
; coltanaconda, glock, beretta393, pp2000, tmp, mp5k, ump45, kriss, p90, uzi, ak47, m4, scar, famas, fal,
; tavor, m16, masada, fn2000, aug, rpd, sa80, mg4, m240, spas12, aa12, striker, ranger, m1014, model1887,
; cheytac, barrett, wa2000, m21, rpg, at4, m79). Restart RE4 after changing.
; The Mine Thrower and the P.R.L. 412 have no MW2 gun yet: equipping them keeps the last MW2 gun.
Handgun=usp
Punisher=beretta
Red9=deserteagle
Blacktail=glock
Matilda=beretta393
BrokenButterfly=coltanaconda
Killer7=deserteaglegold
Handcannon=coltanaconda
Shotgun=spas12
RiotGun=m1014
Striker=striker
Rifle=cheytac
SemiAutoRifle=barrett
TMP=tmp
ChicagoTypewriter=ak47
RocketLauncher=rpg
